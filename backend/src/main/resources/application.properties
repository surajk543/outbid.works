spring.application.name=backend
server.port=${SERVER_PORT:8080}

# --- PostgreSQL ---------------------------------------------------------
# Local PostgreSQL 17 on the default port (same server pgAdmin connects to).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/outbid}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# --- JPA ----------------------------------------------------------------
# Fine for local dev. Switch to a migration tool (Flyway/Liquibase) before prod.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- Security -----------------------------------------------------------
# Dev-only credentials. Override with env vars in any shared environment.
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin}

# --- CORS ---------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
